<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Expanding the computational foundation</title><desc id="desc">Six memory lanes unite a starting capacity of sixteen gigabytes with the ordered ninety-six-gigabyte workstation.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#252018"/><stop offset="1" stop-color="#060707"/></linearGradient><linearGradient id="gold"><stop stop-color="#785333"/><stop offset="1" stop-color="#e4c792"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d6b780" stroke-opacity=".045"/></pattern></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><g fill="url(#gold)" opacity=".7"><rect x="795" y="238" width="650" height="30"/><rect x="795" y="291" width="650" height="30"/><rect x="795" y="344" width="650" height="30"/><rect x="795" y="397" width="650" height="30"/><rect x="795" y="450" width="650" height="30"/><rect x="795" y="503" width="650" height="30"/></g><path d="M120 650H1480" stroke="#80613f"/><g font-family="Helvetica Neue,Arial,sans-serif"><text x="120" y="122" font-size="19" letter-spacing="4" fill="#bd9e70">NaS / SCIENTIFIC INFRASTRUCTURE</text><text x="108" y="448" font-size="205" font-weight="300" letter-spacing="-14" fill="#f1e4cb">96<tspan font-size="52" letter-spacing="0"> GB</tspan></text><text x="120" y="521" font-size="25" fill="#c9b38d">A larger working environment.</text><text x="120" y="571" font-size="18" fill="#9a8b73">M5 Ultra · 30-core CPU · 64-core GPU · 2 TB SSD</text><text x="120" y="728" font-size="37" font-weight="300" letter-spacing="-1" fill="#e9e0cf">For the next questions.</text><text x="120" y="782" font-size="19" fill="#a99a80">16 GB starting capacity → 96 GB on order</text><text x="1480" y="785" text-anchor="end" font-size="14" letter-spacing="2" fill="#b2966c">CAPACITY, NOT A BENCHMARK</text></g></svg>